<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}项目{% endblock %} · AI协作工作台</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; line-height: 1.6; }
    main { max-width: 860px; margin: 32px auto; padding: 0 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .muted { color: #57606a; font-size: 0.92rem; }
    .card { background: #fff; border: 1px solid #d8dee4; border-radius: 10px; padding: 20px; min-width: 0; }
    .card + .card { margin-top: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
    button, .button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary, .button.primary { background: #1f6feb; color: #fff; }
    button.secondary, .button.secondary { background: #fff; border-color: #d0d7de; color: #1f2328; }
    .inline { display: inline; }
    .dir { font-family: ui-monospace, Consolas, monospace; background: #f0f3f6; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .status.on { background: #dafbe1; color: #1a7f37; }
    .status.off { background: #fff1e5; color: #9a3412; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; }
    .alert { margin: 16px 0; padding: 10px 14px; border-radius: 8px; overflow-wrap: anywhere; }
    .alert.error { background: #ffebe9; border: 1px solid #ffcecb; color: #82071e; }
    .alert.notice { background: #ddf4ff; border: 1px solid #b6e3ff; color: #0a3069; }
    ul.projects { list-style: none; margin: 0; padding: 0; }
    ul.projects li { border-bottom: 1px solid #eaeef2; padding: 12px 0; }
    ul.projects li:last-child { border-bottom: 0; }
    ul.projects a { color: #0969da; font-weight: 600; text-decoration: none; }
    .empty { color: #57606a; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="muted" style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;">
        <span>当前用户：<strong>{{ user.username }}</strong></span>
        <span>
          <a href="{% url 'projects:list' %}">项目</a>
          <a href="{% url 'workspaces:workspace' %}" style="margin-left:8px;">工作区</a>
          <a href="{% url 'core:home' %}" style="margin-left:8px;">首页</a>
          <form method="post" action="{% url 'accounts:logout' %}" class="inline" style="margin-left:8px;">
            {% csrf_token %}
            <button type="submit" class="secondary">退出登录</button>
          </form>
        </span>
      </p>
      {% block heading %}{% endblock %}
    </header>
    {% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
    {% for message in messages %}<p class="alert notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
