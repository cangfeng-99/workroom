<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}账号{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; line-height: 1.6; }
    main { max-width: 420px; margin: 10vh auto; padding: 28px; background: #fff; border: 1px solid #d8dee4; border-radius: 12px; }
    h1 { font-size: 1.35rem; margin: 0 0 16px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 8px; }
    .help { color: #57606a; font-size: 0.85rem; margin: 4px 0 0; }
    .errorlist { color: #82071e; font-size: 0.88rem; margin: 4px 0 0; padding-left: 18px; }
    .alert { background: #ffebe9; border: 1px solid #ffcecb; color: #82071e; padding: 10px 14px; border-radius: 8px; margin: 0 0 14px; }
    button { font: inherit; width: 100%; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; background: #1f6feb; color: #fff; cursor: pointer; }
    .switch { margin: 16px 0 0; font-size: 0.92rem; }
    a { color: #0969da; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
