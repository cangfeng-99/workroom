<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI协作工作台</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
    main { max-width: 640px; margin: 12vh auto; padding: 32px; background: #fff; border-radius: 12px; }
    h1 { font-size: 1.6rem; margin-top: 0; }
    .ok { color: #1a7f37; font-weight: 600; }
    p { line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>AI协作工作台</h1>
    <p class="ok">Django服务已启动</p>
    <p>当前提供首页、健康检查与本机文件夹工作区。</p>
    <p>
      <a href="/projects/">我的项目</a> ·
      <a href="/workspace/">进入本机文件夹工作区</a>
    </p>
    <p><a href="/api/health/">健康接口 /api/health/</a></p>
    {% if user.is_authenticated %}
      <p>已登录：<strong>{{ user.username }}</strong></p>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">退出登录</button>
      </form>
    {% else %}
      <p><a href="{% url 'accounts:login' %}">登录</a> · <a href="{% url 'accounts:signup' %}">注册</a></p>
    {% endif %}
  </main>
</body>
</html>
