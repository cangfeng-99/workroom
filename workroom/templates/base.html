{% load static %}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WorkRoom{% endblock %}</title>
  <link rel="icon" href="{% static 'workroom/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'workroom/app.css' %}?v=20261030B">
  <link rel="stylesheet" href="{% static 'workroom/theme-neumorph.css' %}?v=20261030B">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="page-progress" data-page-progress aria-hidden="true"></div>
  {% if local_preview %}<div class="preview-notice" role="status">本机多人版预览 · 独立数据 · 尚未部署云服务器</div>{% endif %}
  {% block content %}{% endblock %}
  <script>
    (function () {
      var bar = document.querySelector('[data-page-progress]');
      if (!bar) { return; }
      document.addEventListener('click', function (event) {
        var link = event.target.closest && event.target.closest('a[href]');
        if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) { return; }
        if (link.target === '_blank' || link.hasAttribute('download')) { return; }
        var href = link.getAttribute('href') || '';
        if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) { return; }
        if (link.host && link.host !== location.host) { return; }
        document.body.classList.add('is-navigating');
      });
      window.addEventListener('pageshow', function () {
        document.body.classList.remove('is-navigating');
      });
      // 演示模式：按 F 全屏看板，Esc 退出
      document.addEventListener('keydown', function (event) {
        var tag = (event.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || event.target.isContentEditable) {
          return;
        }
        if (event.key === 'f' || event.key === 'F') {
          document.body.classList.toggle('present-mode');
        } else if (event.key === 'Escape') {
          document.body.classList.remove('present-mode');
        }
      });
    })();
  </script>
  <script src="{% static 'workroom/app.js' %}?v=20261030B" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
