{% extends 'base.html' %}
{% block title %}注册 · WorkRoom{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>注册 WorkRoom</h1>
    <p class="hint">密码至少 8 位，且不能是常见密码或纯数字。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="invite" value="{{ invite }}">
      <label for="username">用户名</label>
      <input id="username" name="username" maxlength="150" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="password2">再输一次</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
      <button class="btn primary" type="submit">注册并登录</button>
    </form>
    <p class="hint">已有账号？<a href="{% url 'projects:login' %}">登录</a></p>
  </div>
</div>
{% endblock %}
